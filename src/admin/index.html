<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purrsonality Seller — admin</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1115; --panel: #1a1d24; --border: #2a2f3a;
      --text: #e6e8eb; --muted: #8a93a3; --accent: #7dd3fc;
      --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fafafa; --panel: #fff; --border: #e5e7eb; --text: #111827; --muted: #6b7280; --accent: #0369a1; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px; line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge.ok { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
    .badge.err { background: rgba(248, 113, 113, 0.15); color: var(--err); }
    .badge.warn { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
      padding: 16px; margin-bottom: 16px;
    }
    .panel h2 {
      margin: 0 0 12px 0; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
    .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .value { font-size: 18px; font-weight: 600; margin-top: 2px; }
    .stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); font-style: italic; padding: 12px 0; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    input, button {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 12px;
    }
    button { cursor: pointer; background: var(--accent); color: var(--bg); border: 0; font-weight: 600; }
    button:hover { opacity: 0.85; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: normal; }
    .status-line { font-size: 11px; color: var(--muted); margin-left: auto; }
    .status-line.error { color: var(--err); }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="agent-name">Purrsonality Seller</h1>
    <span class="sub" id="agent-meta">loading…</span>
    <span class="badge" id="health-badge">—</span>
  </header>

  <div class="panel">
    <div class="toolbar">
      <label for="token" style="color: var(--muted); font-size: 11px;">TOKEN</label>
      <input id="token" type="password" placeholder="ADCP_AUTH_TOKEN" style="flex: 1; max-width: 400px;" autocomplete="off">
      <button id="refresh">Refresh</button>
      <button id="auto" class="ghost">Auto: <span id="auto-state">OFF</span></button>
      <span class="status-line" id="status">—</span>
    </div>
  </div>

  <div class="panel">
    <h2>Process</h2>
    <div class="grid" id="process-grid">
      <div class="stat"><div class="label">uptime</div><div class="value" id="uptime">—</div></div>
      <div class="stat"><div class="label">memory rss</div><div class="value" id="mem-rss">—</div><div class="sub" id="mem-heap">heap —</div></div>
      <div class="stat"><div class="label">total tool calls</div><div class="value" id="total-calls">—</div></div>
      <div class="stat"><div class="label">total errors</div><div class="value" id="total-errors">—</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Tool counters</h2>
    <table id="counters-table">
      <thead><tr><th>Tool</th><th class="num">Calls</th><th class="num">Errors</th><th>Error classes</th></tr></thead>
      <tbody><tr><td colspan="4" class="empty">no data yet — waiting for first call</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Tool latencies (ms)</h2>
    <table id="durations-table">
      <thead><tr><th>Tool</th><th class="num">N</th><th class="num">avg</th><th class="num">p50</th><th class="num">p95</th><th class="num">p99</th><th class="num">max</th></tr></thead>
      <tbody><tr><td colspan="7" class="empty">no data yet</td></tr></tbody>
    </table>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const tokenInput = $('token');
const stored = localStorage.getItem('purrsonality-admin-token');
if (stored) tokenInput.value = stored;
tokenInput.addEventListener('change', () => localStorage.setItem('purrsonality-admin-token', tokenInput.value));

let autoTimer = null;
const AUTO_INTERVAL_MS = 30_000;

function fmtUptime(s) {
  if (s == null) return '—';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

function setStatus(text, kind) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status-line' + (kind === 'error' ? ' error' : '');
}

async function loadInfo() {
  try {
    const res = await fetch('/api/info');
    const j = await res.json();
    $('agent-name').textContent = j.agent_name;
    $('agent-meta').textContent = `v${j.agent_version} · db=${j.database_backend} · env=${j.node_env} · started ${new Date(j.started_at).toLocaleString()}`;
  } catch (err) {
    setStatus('Failed /api/info: ' + err.message, 'error');
  }
}

async function loadMetrics() {
  const token = tokenInput.value.trim();
  if (!token) {
    setStatus('Token required.', 'error');
    $('health-badge').textContent = 'AUTH';
    $('health-badge').className = 'badge warn';
    return;
  }
  try {
    const res = await fetch('/api/metrics', { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) {
      setStatus('Unauthorized — token wrong?', 'error');
      $('health-badge').textContent = '401';
      $('health-badge').className = 'badge err';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    render(j);
    setStatus('updated ' + new Date().toLocaleTimeString());
    $('health-badge').textContent = 'OK';
    $('health-badge').className = 'badge ok';
  } catch (err) {
    setStatus('Failed /api/metrics: ' + err.message, 'error');
    $('health-badge').textContent = 'ERR';
    $('health-badge').className = 'badge err';
  }
}

function render(j) {
  // Process
  $('uptime').textContent = fmtUptime(j.uptime_s);
  $('mem-rss').textContent = (j.memory_mb?.rss ?? '—') + ' MB';
  $('mem-heap').textContent = `heap ${j.memory_mb?.heap_used ?? '—'} / ${j.memory_mb?.heap_total ?? '—'} MB`;

  const calls = j.counters?.tool_calls_total ?? {};
  const errs = j.counters?.tool_errors_total ?? {};
  const durs = j.durations?.tool_duration_ms ?? {};

  const totalCalls = Object.values(calls).reduce((a, b) => a + b, 0);
  const totalErrors = Object.values(errs).reduce((a, b) => a + b, 0);
  $('total-calls').textContent = totalCalls;
  $('total-errors').textContent = totalErrors;

  // Counters table — group by tool
  const errorsByTool = {};
  for (const [key, count] of Object.entries(errs)) {
    const [tool, cls] = key.split('|');
    if (!errorsByTool[tool]) errorsByTool[tool] = {};
    errorsByTool[tool][cls || 'unknown'] = count;
  }
  const tools = Object.keys(calls).sort((a, b) => calls[b] - calls[a]);
  const cTbody = $('counters-table').querySelector('tbody');
  if (tools.length === 0) {
    cTbody.innerHTML = '<tr><td colspan="4" class="empty">no calls yet</td></tr>';
  } else {
    cTbody.innerHTML = tools.map(t => {
      const errs = errorsByTool[t] ?? {};
      const errSum = Object.values(errs).reduce((a, b) => a + b, 0);
      const errClasses = Object.entries(errs).map(([c, n]) => `${escapeHtml(c)} (${n})`).join(', ') || '—';
      return `<tr><td>${escapeHtml(t)}</td><td class="num">${calls[t]}</td><td class="num">${errSum}</td><td>${errClasses}</td></tr>`;
    }).join('');
  }

  // Durations table
  const dTbody = $('durations-table').querySelector('tbody');
  const durToolsSorted = Object.keys(durs).sort((a, b) => (durs[b]?.p95_ms ?? 0) - (durs[a]?.p95_ms ?? 0));
  if (durToolsSorted.length === 0) {
    dTbody.innerHTML = '<tr><td colspan="7" class="empty">no durations yet</td></tr>';
  } else {
    dTbody.innerHTML = durToolsSorted.map(t => {
      const d = durs[t];
      return `<tr>
        <td>${escapeHtml(t)}</td>
        <td class="num">${d.count}</td>
        <td class="num">${d.avg_ms}</td>
        <td class="num">${d.p50_ms}</td>
        <td class="num">${d.p95_ms}</td>
        <td class="num">${d.p99_ms}</td>
        <td class="num">${d.max_ms}</td>
      </tr>`;
    }).join('');
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('refresh').addEventListener('click', loadMetrics);
$('auto').addEventListener('click', () => {
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null;
    $('auto-state').textContent = 'OFF';
  } else {
    loadMetrics();
    autoTimer = setInterval(loadMetrics, AUTO_INTERVAL_MS);
    $('auto-state').textContent = 'ON (30s)';
  }
});

loadInfo();
if (stored) loadMetrics();
</script>
</body>
</html>
