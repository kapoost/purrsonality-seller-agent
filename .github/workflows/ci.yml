name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check (tsc --noEmit, strict)
        run: bun --bun tsc --noEmit -p .

  storyboard:
    name: AdCP storyboard compliance
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      PORT: 3001
      ADCP_AUTH_TOKEN: ci_prod_token_unused_in_storyboard_run
      ADCP_TEST_TOKEN: ci_smoke_test_token_for_storyboard_run
      PUBLIC_BASE_URL: http://127.0.0.1:3001
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start seller agent (in-memory fallback, no DATABASE_URL)
        run: |
          bun run src/index.ts > /tmp/seller.log 2>&1 &
          echo $! > /tmp/seller.pid
          sleep 3
          curl -sf -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADCP_TEST_TOKEN" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}' > /dev/null
          echo "Seller agent up"

      - name: Run AdCP storyboard suite
        run: |
          bunx adcp storyboard run http://127.0.0.1:3001/mcp \
            --auth $ADCP_TEST_TOKEN \
            --test-kit node_modules/@adcp/sdk/compliance/cache/3.1.0/test-kits/acme-outdoor.yaml \
            --allow-http \
            --timeout 180 \
            --summary-output /tmp/summary.json 2>&1 | tee /tmp/storyboard.out

      - name: Parse storyboard summary
        id: parse
        run: |
          PASSED=$(jq -r '.passed' /tmp/summary.json)
          FAILED=$(jq -r '.failed' /tmp/summary.json)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "## Storyboard Result (cache 3.1.0)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Pass threshold | 240 |" >> $GITHUB_STEP_SUMMARY
          echo "| Fail threshold | 5 |" >> $GITHUB_STEP_SUMMARY

      - name: Regression guard (must pass ≥240, fail ≤5)
        run: |
          PASSED=${{ steps.parse.outputs.passed }}
          FAILED=${{ steps.parse.outputs.failed }}
          # Baseline locked 2026-06-27 against cache 3.1.0 acme-outdoor:
          #   pass=246, fail=3, skip=83
          # Pass floor 240 = 6-scenario slack against the measured baseline.
          # Fail ceiling 5 = covers the 3 measured + 2 upstream-blocked fails
          # that can surface depending on test-kit auth (billing_gate
          # demo-billing-passthrough-v1, deny_live_caller, pagination
          # seed_account #5723, dependency_impairment #5707).
          if [ "$PASSED" -lt 240 ]; then
            echo "::error::Regression: $PASSED < 240 baseline. Investigate failed storyboards before merging."
            exit 1
          fi
          if [ "$FAILED" -gt 5 ]; then
            echo "::error::New failure: $FAILED > 5 baseline. Known upstream blockers: pagination_integrity_list_accounts (adcp#5723 P0 — seed_account UNKNOWN_SCENARIO), dependency_impairment (adcp#5707 — transition.from SHOULD vs MUST). Local-only: billing_gate_dispatch (AAO test-kit bearer mismatch), comply_controller_mode_gate (FORBIDDEN code on live caller). Investigate any new fail."
            exit 1
          fi
          echo "OK: $PASSED passed ≥ 240 baseline, $FAILED failed ≤ 5 baseline"

      - name: Stop seller agent
        if: always()
        run: |
          if [ -f /tmp/seller.pid ]; then
            kill $(cat /tmp/seller.pid) 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seller-logs
          path: |
            /tmp/seller.log
            /tmp/storyboard.out
            /tmp/summary.json

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E suite
        run: bunx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
