name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check (tsc --noEmit, strict)
        run: bun --bun tsc --noEmit -p .

  storyboard:
    name: AdCP storyboard compliance
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      PORT: 3001
      ADCP_AUTH_TOKEN: ci_prod_token_unused_in_storyboard_run
      ADCP_TEST_TOKEN: ci_smoke_test_token_for_storyboard_run
      PUBLIC_BASE_URL: http://127.0.0.1:3001
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start seller agent (in-memory fallback, no DATABASE_URL)
        run: |
          bun run src/index.ts > /tmp/seller.log 2>&1 &
          echo $! > /tmp/seller.pid
          sleep 3
          curl -sf -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADCP_TEST_TOKEN" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}' > /dev/null
          echo "Seller agent up"

      - name: Resolve bundled 3.1 compliance cache
        id: cache
        run: |
          # The SDK bundles one stable 3.1.x cache and renames it on every bump
          # (3.1.0 -> 3.1.20 -> 3.1.30). Hardcoding the directory silently rots:
          # a missing --test-kit path failed this job from 2026-06-27 to
          # 2026-10-30 while still reporting as a gate. Resolve it instead.
          DIR=$(ls -d node_modules/@adcp/sdk/compliance/cache/3.1.* \
                | grep -v -- '-beta' | sort -V | tail -1)
          KIT="$DIR/test-kits/acme-outdoor.yaml"
          if [ ! -f "$KIT" ]; then
            echo "::error::No acme-outdoor test kit under $DIR. Bundled caches:"
            ls -1 node_modules/@adcp/sdk/compliance/cache/ || true
            exit 1
          fi
          echo "version=$(basename "$DIR")" >> $GITHUB_OUTPUT
          echo "kit=$KIT" >> $GITHUB_OUTPUT
          echo "Using compliance cache $(basename "$DIR")"

      - name: Run AdCP storyboard suite
        run: |
          bunx adcp storyboard run http://127.0.0.1:3001/mcp \
            --auth $ADCP_TEST_TOKEN \
            --test-kit "${{ steps.cache.outputs.kit }}" \
            --allow-http \
            --timeout 180 \
            --summary-output /tmp/summary.json 2>&1 | tee /tmp/storyboard.out

      - name: Parse storyboard summary
        id: parse
        run: |
          PASSED=$(jq -r '.passed' /tmp/summary.json)
          FAILED=$(jq -r '.failed' /tmp/summary.json)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "## Storyboard Result (cache ${{ steps.cache.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Pass threshold | 78 |" >> $GITHUB_STEP_SUMMARY
          echo "| Fail threshold | 2 |" >> $GITHUB_STEP_SUMMARY

      - name: Regression guard (must pass ≥78, fail ≤2)
        run: |
          PASSED=${{ steps.parse.outputs.passed }}
          FAILED=${{ steps.parse.outputs.failed }}
          # Baseline re-locked 2026-10-30 against cache 3.1.30 acme-outdoor on
          # @adcp/sdk 13.1.4, in-memory store, two consecutive runs:
          #   pass=81, fail=0, skip=45, not_selected=7 (version_excluded)
          #
          # The previous floor (240) came from cache 3.1.0 on 2026-06-27. That
          # cache stopped shipping, so the step errored on a missing path and
          # the job stayed red from then until 2026-10-30 — a gate that fails
          # unconditionally reports exactly as much as no gate at all. The step
          # counts are not comparable across cache generations: 3.1.30 selects
          # a smaller set for a single-publisher sales-non-guaranteed seller.
          #
          # Pass floor 78 = 3-step slack against the measured 81.
          # Fail ceiling 2 = headroom for the two auth-dependent fails that can
          # surface on the AAO test-kit bearer (billing_gate
          # demo-billing-passthrough-v1, comply_controller_mode_gate
          # deny_live_caller — grader substitutes a sandbox bearer, our side
          # verified correct 2026-09-23). Both measured 0 here.
          if [ "$PASSED" -lt 78 ]; then
            echo "::error::Regression: $PASSED < 78 baseline (cache ${{ steps.cache.outputs.version }}). Investigate failed storyboards before merging."
            exit 1
          fi
          if [ "$FAILED" -gt 2 ]; then
            echo "::error::New failure: $FAILED > 2 baseline. Auth-dependent knowns: billing_gate_dispatch (AAO test-kit bearer mismatch), comply_controller_mode_gate (FORBIDDEN code on live caller). Investigate any new fail."
            exit 1
          fi
          echo "OK: $PASSED passed ≥ 78 baseline, $FAILED failed ≤ 2 baseline (cache ${{ steps.cache.outputs.version }})"

      - name: Stop seller agent
        if: always()
        run: |
          if [ -f /tmp/seller.pid ]; then
            kill $(cat /tmp/seller.pid) 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seller-logs
          path: |
            /tmp/seller.log
            /tmp/storyboard.out
            /tmp/summary.json

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E suite
        run: bunx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
