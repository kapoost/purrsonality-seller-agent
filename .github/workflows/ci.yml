name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check (tsc --noEmit, strict)
        run: bun --bun tsc --noEmit -p .

  storyboard:
    name: AdCP storyboard compliance
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      PORT: 3001
      ADCP_AUTH_TOKEN: ci_prod_token_unused_in_storyboard_run
      ADCP_TEST_TOKEN: ci_smoke_test_token_for_storyboard_run
      PUBLIC_BASE_URL: http://127.0.0.1:3001
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start seller agent (in-memory fallback, no DATABASE_URL)
        run: |
          bun run src/index.ts > /tmp/seller.log 2>&1 &
          echo $! > /tmp/seller.pid
          sleep 3
          curl -sf -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADCP_TEST_TOKEN" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}' > /dev/null
          echo "Seller agent up"

      - name: Run AdCP storyboard suite
        run: |
          bunx adcp storyboard run http://127.0.0.1:3001/mcp \
            --auth $ADCP_TEST_TOKEN \
            --test-kit node_modules/@adcp/sdk/compliance/cache/3.0.12/test-kits/acme-outdoor.yaml \
            --allow-http \
            --timeout 120 \
            --summary-output /tmp/summary.json 2>&1 | tee /tmp/storyboard.out

      - name: Parse storyboard summary
        id: parse
        run: |
          PASSED=$(jq -r '.passed' /tmp/summary.json)
          FAILED=$(jq -r '.failed' /tmp/summary.json)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "## Storyboard Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold (regression guard) | 131 |" >> $GITHUB_STEP_SUMMARY

      - name: Regression guard (must pass ≥131, fail ≤1)
        run: |
          PASSED=${{ steps.parse.outputs.passed }}
          FAILED=${{ steps.parse.outputs.failed }}
          if [ "$PASSED" -lt 131 ]; then
            echo "::error::Regression: $PASSED < 131 baseline. Investigate failed storyboards before merging."
            exit 1
          fi
          if [ "$FAILED" -gt 1 ]; then
            echo "::error::New failure: $FAILED > 1 baseline (known: pagination_integrity_list_accounts/first_page, upstream #4914). Investigate before merging."
            exit 1
          fi
          echo "OK: $PASSED passed ≥ 131 baseline, $FAILED failed ≤ 1 baseline"

      - name: Stop seller agent
        if: always()
        run: |
          if [ -f /tmp/seller.pid ]; then
            kill $(cat /tmp/seller.pid) 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seller-logs
          path: |
            /tmp/seller.log
            /tmp/storyboard.out
            /tmp/summary.json

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E suite
        run: bunx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
