# Fly.io deployment config. Bun-native AdCP seller agent.
# Region fra (Frankfurt) — co-located z Neon Postgres (eu-central-1)
# dla sub-ms DB round-trip. Warsaw (waw) deprecated 2026-05.

app = "purrsonality-seller"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PUBLIC_BASE_URL = "https://purrsonality-seller.fly.dev"
  # ADCP_SANDBOX celowo NIE 1 — production reject live caller comply controller
  # (per Addie #1, "compliance_testing block niewidoczny dla live principal").
  # Seed 5 persona-tagged banners on boot so /live/result-slot?persona=X can
  # route to the matching creative without waiting for an actual sync_creatives
  # upload. Idempotent — creativesStore.submit updates existing rows in place.
  DEMO_SEED_CREATIVE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Warmup path — abzu-gui fires POST /warmup on Sam view load which fans
  # health checks to every critical agent, waking this seller ~200-500ms
  # before the buyer clicks Discover. Reverted from always-on because the
  # browser pre-warm covers the cold-start window at $0/month.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Brak [[http_service.checks]] — Fly defaultuje TCP-readiness na internal_port,
# co pasuje do naszego MCP serve() (no /healthz endpoint, POST /mcp wymaga JSON-RPC
# body z initialize żeby zwrócić 200 — bezsensowne jako health probe).

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
